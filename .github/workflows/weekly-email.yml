name: Sunday email

# Runs at 15:00 and 16:00 UTC on Sundays. One of those is 8 a.m. Pacific (it shifts with daylight
# saving); the function sends only between 8 and 11 a.m. Pacific, and only once per person per week.
on:
  schedule:
    - cron: '0 15,16 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = send Leigh a copy now; send = the real Sunday email to everyone'
        type: choice
        options: [test, send]
        default: test
      as:
        description: 'Test only: whose email to copy to you (a first name, like Rick). Blank = your own.'
        required: false
        default: ''

jobs:
  email:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: iozcageqqmoykdjizgob
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Call the digest function
        run: |
          # A fresh key each run: saved as the function's DIGEST_KEY secret, then used to call it.
          KEY=$(openssl rand -hex 24)
          echo "::add-mask::$KEY"
          supabase secrets set DIGEST_KEY="$KEY" --project-ref "$REF" --yes
          MODE="${{ github.event.inputs.mode || 'send' }}"
          FORCE=false
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$MODE" = "send" ] && FORCE=true
          BODY=$(jq -nc --arg mode "$MODE" --arg as "${{ github.event.inputs.as }}" --argjson force $FORCE '{mode:$mode, as:$as, force:$force}')
          # The function picks up the new secret within a few seconds; retry until it does.
          for i in 1 2 3 4 5 6; do
            sleep 10
            CODE=$(curl -sS -o out.json -w '%{http_code}' -X POST "https://$REF.supabase.co/functions/v1/digest" \
              -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d "$BODY")
            [ "$CODE" != "401" ] && break
            echo "Waiting for the new key ($i)…"
          done
          cat out.json; echo
          [ "$CODE" = "200" ] && ! grep -q '"error"' out.json
