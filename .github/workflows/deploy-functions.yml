name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy tmdb --project-ref iozcageqqmoykdjizgob --use-api --yes
      # digest runs its own checks, so the unsubscribe link works from an email with nobody signed in.
      - run: supabase functions deploy digest --project-ref iozcageqqmoykdjizgob --use-api --no-verify-jwt --yes
